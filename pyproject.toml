[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mira"
version = "0.1.0"
description = "Mira — autonomous digital CFO for HackMIT 2026"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mira / HackMIT 2026" }]
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36,<2.1",
  "pydantic>=2.10.0,<3",
  "pydantic-settings>=2.6.0",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.17",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
openai = [
  "openai-agents>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["packages"]
include = ["mira*"]

[tool.pytest.ini_options]
pythonpath = ["packages", "apps/api"]
testpaths = ["apps/api/tests", "packages/mira"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
